[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "preprocessing"
version = "0.1.0"
description = "Preprocessing utilities for linguistic data"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    {include = "preprocessing"}
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dkpro-cassis = ">=0.10.1,<0.11.0"
spacy = ">=3.8.7,<4.0.0"
stanza = ">=1.7.0"
nltk = ">=3.8.0"
pandas = "^3.0.2"
python-docx = "^1.2.0"
streamlit = "^1.56.0"
py-lift = {path = "/home/ruppenhofer/.cache/pypoetry/virtualenvs/preprocessing-cmlifn-K-py3.12/src/linguistic-features-in-text/py_lift"}
python-dotenv = "^1.2.2"
lingua-language-detector = "^2.0.0"
# EDU segmenter (preprocessing.discourse / add_edus.py) — wraps
# the HF model poyum/test_discut. The model itself is downloaded
# once into the HF cache; runtime is offline (see preprocessing/_hf_offline.py).
transformers = ">=4.40.0"
torch = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3,<8.0.0"
